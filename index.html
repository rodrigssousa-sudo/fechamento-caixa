    const APP_TIMEZONE = "America/Sao_Paulo";

    function nowSP(){
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: APP_TIMEZONE,
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }).formatToParts(new Date()).reduce((acc,p)=>{ acc[p.type]=p.value; return acc; }, {});

      return new Date(`${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}`);
    }

    function datePartsSP(value = new Date()){
      const d = value?.toDate ? value.toDate() : new Date(value || Date.now());

      if(isNaN(d)) return null;

      return new Intl.DateTimeFormat("en-CA", {
        timeZone: APP_TIMEZONE,
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }).formatToParts(d).reduce((acc,p)=>{ acc[p.type]=p.value; return acc; }, {});
    }

    function dateKeySP(value = new Date()){
      const p = datePartsSP(value);
      if(!p) return "";
      return `${p.year}-${p.month}-${p.day}`;
    }

    function localInputSP(value = new Date()){
      const p = datePartsSP(value);
      if(!p) return "";
      return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;

    function bkDateFromAny(value){
      if(!value) return null;
      if(value?.toDate){
        const d = value.toDate();
        return isNaN(d) ? null : d;
      }
      if(value instanceof Date){
        return isNaN(value) ? null : value;

    function bkHistoryTimestampMs(item){
      const t = item?.turno || {};
      const candidates = [
        item?.sortAt,
        t.sortAt,
        item?.selectedSortAt,
        t.selectedSortAt,
        item?.adjustmentSortAt,
        t.adjustmentSortAt,
        item?.submittedAt,
        t.submittedAt,
        t.adjustmentChosenDate,
        t.adjustmentDate,
        item?.adjustmentChosenDate,
        item?.adjustmentDate,
        t.closingDate,
        t.dataFechamento,
        item?.createdAt
      ];

      for(const c of candidates){
        const d = bkDateFromAny(c);
        if(d) return d.getTime();
      }

      return 0;
    }

    function periodStartSP(range){
      const d = nowSP();

      if(range === "day"){
        d.setHours(0,0,0,0);
        return d;
      }

      if(range === "week"){
        d.setDate(d.getDate() - 7);
        d.setHours(0,0,0,0);
        return d;
      }

      if(range === "month"){
        d.setMonth(d.getMonth() - 1);
        d.setHours(0,0,0,0);
        return d;
      }

      return null;
    }

      document.addEventListener("focusin", (ev)=>{
        const el = ev.target;

        }

        const el = ev.target;

        }
      }, true);

      document.addEventListener("input", (ev)=>{
        const el = ev.target;
        if(!el || el.tagName !== "INPUT" || !isMoneyInput(el)) return;

        const before = el.value;
        const clean = normalizeMoneyTypingValue(before);

        if(before !== clean){
          const pos = el.selectionStart || clean.length;
          el.value = clean;
          try{
            const next = Math.max(0, Math.min(clean.length, pos - (before.length - clean.length)));
            el.setSelectionRange(next,next);
          }catch(_){}
        }
      }, true);
    }

    function bkStableCleanMoney(value, caret){
      const raw = String(value ?? "");
      let clean = "";
      let nextCaret = Number(caret ?? raw.length);
      for(let i=0;i<raw.length;i++){
        const ch = raw[i];
        const ok = /[\d,.-]/.test(ch);
        if(ok){ clean += ch; }
        else if(i < nextCaret){ nextCaret--; }
      }
      nextCaret = Math.max(0, Math.min(clean.length, nextCaret));
      return { clean, caret: nextCaret };
    }

function bkMoneyOnlyDigits(value){
  return String(value == null ? "" : value).replace(/\D/g,"");
}

function bkMoneyNormalizeDigits(digits){
  digits = String(digits || "").replace(/\D/g,"");
  digits = digits.replace(/^0+(?=\d{3,})/,"");
  return digits;
}

function bkMoneyFormatFromDigits(digits){
  digits = bkMoneyNormalizeDigits(digits);
  if(!digits) return "0,00";

  while(digits.length < 3){
    digits = "0" + digits;
  }

  var cents = digits.slice(-2);
  var integer = digits.slice(0,-2).replace(/^0+(?=\d)/,"");
  if(!integer) integer = "0";
  integer = integer.replace(/\B(?=(\d{3})+(?!\d))/g,".");
  return integer + "," + cents;
}

function bkMoneyDigitIndexFromCaret(text, caret){
  return bkMoneyOnlyDigits(String(text || "").slice(0, Math.max(0, caret || 0))).length;
}

function bkMoneyCaretFromDigitIndex(text, digitIndex){
  var value = String(text || "");
  if(digitIndex <= 0) return 0;

  var seen = 0;
  for(var i=0;i<value.length;i++){
    if(/\d/.test(value[i])){
      seen++;
      if(seen >= digitIndex) return i + 1;
    }
  }
  return value.length;
}

function bkMoneySetCaret(el, digitIndex){
  var pos = bkMoneyCaretFromDigitIndex(el.value, digitIndex);
  try{ el.setSelectionRange(pos,pos); }catch(e){}

  requestAnimationFrame(function(){
    try{
      var p = bkMoneyCaretFromDigitIndex(el.value, digitIndex);
      el.setSelectionRange(p,p);
    }catch(e){}
  });
}

function bkMoneyPrepare(el){

function bkMoneyApplyEdit(el, inputType, data){
  var currentValue = String(el.value || "");
  var digits = bkMoneyOnlyDigits(currentValue);

  var start = el.selectionStart == null ? currentValue.length : el.selectionStart;
  var end = el.selectionEnd == null ? start : el.selectionEnd;

  var startIndex = bkMoneyDigitIndexFromCaret(currentValue, start);
  var endIndex = bkMoneyDigitIndexFromCaret(currentValue, end);
  var hasSelection = start !== end;
  var nextIndex = startIndex;

  if(inputType === "insertText"){
    var incoming = bkMoneyOnlyDigits(data || "");
    if(!incoming) return;

    if(hasSelection){
      digits = digits.slice(0,startIndex) + digits.slice(endIndex);
    }

    digits = digits.slice(0,startIndex) + incoming + digits.slice(startIndex);
    nextIndex = startIndex + incoming.length;
  }

  if(inputType === "insertFromPaste"){
    var pasted = bkMoneyOnlyDigits(data || "");
    if(!pasted) return;

    if(hasSelection){
      digits = digits.slice(0,startIndex) + digits.slice(endIndex);
    }

    digits = digits.slice(0,startIndex) + pasted + digits.slice(startIndex);
    nextIndex = startIndex + pasted.length;
  }

  if(inputType === "deleteContentBackward"){
    if(hasSelection){
      digits = digits.slice(0,startIndex) + digits.slice(endIndex);
      nextIndex = startIndex;
    }else{
      if(startIndex <= 0) return;
      digits = digits.slice(0,startIndex - 1) + digits.slice(startIndex);
      nextIndex = startIndex - 1;
    }
  }

  if(inputType === "deleteContentForward" || inputType === "deleteByCut"){
    if(hasSelection){
      digits = digits.slice(0,startIndex) + digits.slice(endIndex);
      nextIndex = startIndex;
    }else{
      digits = digits.slice(0,startIndex) + digits.slice(startIndex + 1);
      nextIndex = startIndex;
    }
  }

  digits = bkMoneyNormalizeDigits(digits);
  el.value = bkMoneyFormatFromDigits(digits);

  var oldTotal = bkMoneyOnlyDigits(currentValue).length;
  var newTotal = bkMoneyOnlyDigits(el.value).length;

  if(startIndex >= oldTotal && !hasSelection){
    nextIndex = newTotal;
  }

  bkMoneySetCaret(el, nextIndex);
}

function bkInstallMoneyKeyboardFinal(){
  if(window.__BK_MONEY_KEYBOARD_FINAL_INSTALLED) return;

  var prepareAll = function(){

  };

  }catch(e){}

  document.addEventListener("focusin", function(event){
    var el = event.target;
    if(!bkMoneyIsField(el)) return;

    }

    bkMoneySetCaret(el, bkMoneyOnlyDigits(el.value).length);
  }, true);

  document.addEventListener("beforeinput", function(event){
    var el = event.target;
    if(typeof bkIsHardTextField === "function" && bkIsHardTextField(el)) return;
    if(!bkMoneyIsField(el)) return;

    var type = event.inputType || "";
    var allowed = {
      insertText:true,
      insertFromPaste:true,
      deleteContentBackward:true,
      deleteContentForward:true,
      deleteByCut:true
    };

    if(!allowed[type]) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    var data = event.data || "";
    if(type === "insertFromPaste"){
      data = "";
      try{ data = (event.clipboardData || window.clipboardData).getData("text") || ""; }catch(e){}
    }

    if(type === "insertText" && !/^\d+$/.test(data)){
      return;
    }

    bkMoneyApplyEdit(el, type, data);

    queueMicrotask(function(){
      try{ el.dispatchEvent(new Event("change",{bubbles:true})); }catch(e){}
    });
  }, true);

  document.addEventListener("input", function(event){
    var el = event.target;
    if(typeof bkIsHardTextField === "function" && bkIsHardTextField(el)) return;
    if(!bkMoneyIsField(el)) return;

    event.stopImmediatePropagation();

    var digitIndex = bkMoneyDigitIndexFromCaret(el.value, el.selectionStart == null ? el.value.length : el.selectionStart);
    var formatted = bkMoneyFormatFromDigits(el.value);

    if(el.value !== formatted){
      el.value = formatted;
      bkMoneySetCaret(el, Math.min(digitIndex, bkMoneyOnlyDigits(formatted).length));
    }
  }, true);

  document.addEventListener("blur", function(event){
    var el = event.target;
    if(!bkMoneyIsField(el)) return;
    el.value = bkMoneyFormatFromDigits(el.value);
  }, true);
}

function moneyToNumber(value){
      if(value === null || value === undefined) return 0; if(typeof value === "number") return value;
      let s = String(value).trim().replace(/[^0-9,.-]/g, ""); if(!s) return 0;
      const hasComma = s.includes(","), hasDot = s.includes(".");
      if(hasComma && hasDot){ const lastComma=s.lastIndexOf(","), lastDot=s.lastIndexOf("."); s = lastComma > lastDot ? s.split(".").join("").replace(",",".") : s.split(",").join(""); }
      else if(hasComma){ s = s.split(".").join("").replace(",","."); }
      const n = Number(s); return Number.isFinite(n) ? n : 0;
    }

    function formatInputMoney(value){
      const n = moneyToNumber(value);
      if(!n) return "";
      return n.toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
    }

    function applyBankMoneyMask(input){
      if(!input) return;
      input.classList.add("money-input");
      input.setAttribute("autocomplete","off");
      input.setAttribute("inputmode","decimal");

      if(!input.nextElementSibling || !input.nextElementSibling.classList?.contains("input-helper")){
        const helper = document.createElement("div");
        helper.className = "input-helper";
        helper.innerHTML = `<span>Edite qualquer nÃºmero</span><b>0,00</b>`;
        input.insertAdjacentElement("afterend", helper);
      }

      const normalizeDigits = (value) => String(value || "").replace(/\D/g, "");
      const formatDigitsToMoney = (digits) => {
        if(!digits) return "";
        const number = Number(digits) / 100;
        return number.toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
      };

      const countDigitsBeforeCaret = () => {
        const pos = input.selectionStart ?? String(input.value || "").length;
        return normalizeDigits(String(input.value || "").slice(0, pos)).length;
      };

      const setCaretByDigitIndex = (digitIndex) => {
        const value = String(input.value || "");
        if(digitIndex <= 0){
          input.setSelectionRange(0,0);
          return;
        }

        let seen = 0;
        let pos = value.length;
        for(let i=0;i<value.length;i++){
          if(/\d/.test(value[i])){
            seen++;
            if(seen >= digitIndex){
              pos = i + 1;
              break;
            }
          }
        }

        input.setSelectionRange(pos,pos);
      };

      const updateVisual = () => {
        const value = moneyToNumber(input.value || 0);
        input.classList.toggle("input-filled", value > 0);
        input.classList.toggle("input-error", String(input.value || "").includes("-") || !Number.isFinite(value));
        const b = input.nextElementSibling?.querySelector?.("b");
        if(b) b.textContent = value > 0 ? formatMoney(value) : "0,00";
      };

      input.addEventListener("input", () => {
        const digitIndex = countDigitsBeforeCaret();
        const digits = normalizeDigits(input.value);

        if(!digits){
          input.value = "";
          updateVisual();
          input.dispatchEvent(new Event("bankmoney", { bubbles:true }));
          return;
        }

        input.value = formatDigitsToMoney(digits);
        setCaretByDigitIndex(digitIndex);
        updateVisual();
        input.dispatchEvent(new Event("bankmoney", { bubbles:true }));
      });

      input.addEventListener("focus", () => {
        // NÃ£o seleciona tudo: permite apagar/mudar um Ãºnico nÃºmero no meio do valor.
        updateVisual();
      });

      input.addEventListener("blur", () => {
        if(input.value) input.value = formatInputMoney(input.value);
        updateVisual();
      });

      updateVisual();
    }

function getAdjustmentParts(item){
      const t = item?.turno || {};

      const cargaPokerFichas = moneyToNumber(t.cargasPoker || 0);
      const cargaPokerMoney = cargaPokerFichas * 400;
      const cargaPokerDestino = t.cargaPokerDestino || t.quickCargaPokerDestino || "poker";
      const cargaSuprema = moneyToNumber(t.cargaSuprema || (cargaPokerDestino === "suprema" ? cargaPokerMoney : 0));
      const cargaPppoker = moneyToNumber(t.cargaPppoker || (cargaPokerDestino === "pppoker" ? cargaPokerMoney : 0));

      const cargaCasino = moneyToNumber(t.cargasCasino ?? t.cargas ?? 0);
      const cargaCasinoDestino = t.cargaCasinoDestino || t.quickCargaCasinoDestino || "casino";
      const cargaBuffalo = moneyToNumber(t.cargaBuffalo || (cargaCasinoDestino === "buffalo" ? cargaCasino : 0));
      const cargaGanamos = moneyToNumber(t.cargaGanamos || (cargaCasinoDestino === "ganamos" ? cargaCasino : 0));

      let retiradaCaixa = 0;
      if(t.retiradaCaixa !== undefined){
        retiradaCaixa = moneyToNumber(t.retiradaCaixa);
      }else if(Array.isArray(t.outflows) && t.outflows.length){
        retiradaCaixa = t.outflows.reduce((s,x)=>s + moneyToNumber(x.value),0);
      }else{
        retiradaCaixa = moneyToNumber(t.saidasTotal ?? 0);
      }

      return { cargaPoker: cargaPokerMoney, cargaPokerFichas, cargaPokerDestino, cargaSuprema, cargaPppoker, cargaCasino, cargaCasinoDestino, cargaBuffalo, cargaGanamos, retiradaCaixa };
    }

    function adjustmentImpact(item){
      if(!isAdjustmentItem(item)) return 0;

      const { cargaPoker, cargaCasino, retiradaCaixa } = getAdjustmentParts(item);
      const impacto = cargaPoker + cargaCasino - retiradaCaixa;

      // Se tiver campos de ajuste, essa Ã© a fonte da verdade.
      if(cargaPoker || cargaCasino || retiradaCaixa) return impacto;

      // Fallback para ajuste antigo sem estrutura.
      const t = item?.turno || {};
      return moneyToNumber(t.saldoLiquido ?? item?.diff ?? 0);
    }

    function baseForNextClosing(){
      // BASE OPERACIONAL FINAL:
      // 1) Fechamento real passa para o prÃ³ximo turno como: saldoLiquido - retiradas.
      // 2) Ajuste interno altera essa base.
      // 3) Diff do prÃ³ximo fechamento compara saldoLiquido atual contra essa base.
      const view = calculationHistory();
      const lastRealIndex = view.findIndex(item => !isAdjustmentItem(item));
      const lastReal = lastRealIndex >= 0 ? view[lastRealIndex] : null;
      if(!lastReal) return null;

      const lastRealBase = moneyToNumber(lastReal.turno?.baseOperacional ?? lastReal.operationalBase ?? calcularBaseOperacional(lastReal.turno || {}));
      const adjustmentsAfterLastReal = view
        .slice(0, lastRealIndex)
        .filter(isAdjustmentItem)
        .reduce((s,item)=>s + adjustmentImpact(item), 0);

      return lastRealBase + adjustmentsAfterLastReal;
    }

      const reason = t.ajusteMotivo || item.adjustmentReason || "Ajuste interno";
      const sign = value > 0 ? "+" : "";
      return `${sign}${formatMoney(value)} â¢ ${reason}`;

    function previousRealClosingAfter(currentItem){
      const view = calculationHistory();
      const idx = view.findIndex(x => x.id === currentItem?.id);
      const start = idx >= 0 ? idx + 1 : 0;
      return view.slice(start).find(item => !isAdjustmentItem(item)) || null;
    }

    function displayCashDiff(item){
      try{
        if(!item) return 0;

        if(isAdjustmentItem(item)){
          return adjustmentImpact(item);
        }

        const view = calculationHistory();
        const currentIndex = view.findIndex(x => x.id === item.id);
        const currentSaldo = moneyToNumber(item.turno?.saldoLiquido ?? item.currentSaldoTotal ?? 0);

        if(currentIndex < 0) return moneyToNumber(item.diff ?? 0);

        const prevRealIndex = view.findIndex((x, idx) => idx > currentIndex && !isAdjustmentItem(x));
        if(prevRealIndex < 0) return 0;

        const prevReal = view[prevRealIndex];
        const prevBase = moneyToNumber(
          prevReal.turno?.baseOperacional ??
          prevReal.operationalBase ??
          calcularBaseOperacional(prevReal.turno || {})
        );

        // Ajustes internos entre o fechamento anterior e o fechamento atual
        // entram na base, mas nÃ£o entram como lucro/diferenÃ§a operacional.
        const internalAdjustments = view
          .slice(currentIndex + 1, prevRealIndex)
          .filter(isAdjustmentItem)
          .reduce((s,x)=>s + adjustmentImpact(x), 0);

        const baseComparacao = prevBase + internalAdjustments;
        return currentSaldo - baseComparacao;
      }catch(e){
        console.warn("Erro displayCashDiff:", e);
        return 0;
      }
    }

      // Saldo lÃ­quido de conferÃªncia: soma retiradas porque elas saÃ­ram do caixa,

      return webReca+suprema+pppoker+buffalo+ganamos+cargasPoker+cargasCasino-pendentes+saidas;

      const saldoLiquido = moneyToNumber(turno.saldoLiquido ?? calcularSaldoLiquido(turno));

 function getMonthlyGoalProgressData(view, options = {}){
      const target = moneyToNumber(
        currentProfile?.monthlyGoal ||
        currentProfile?.metaMensal ||
        45000000
      );

      const now = nowSP();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

      // FONTE ÃNICA:
      // Meta mensal e BÃ´nus representam exatamente a mesma realizaÃ§Ã£o de lucro do mÃªs.
      // A diferenÃ§a Ã© sÃ³ visual: a Meta mostra valores, o BÃ´nus mostra apenas a porcentagem.
      const source = options.includeRestricted
        ? historyCache
        : (view || visibleHistory());

      const monthItems = source.filter(item => {
        const d = item?.submittedAt?.toDate
          ? item.submittedAt.toDate()
          : new Date(item?.turno?.closingDate || item?.createdAt || 0);

        return !isNaN(d) && d >= monthStart;
      });

      const lucroDoItem = (item) => {
        const t = item?.turno || {};

        const direto = moneyToNumber(t.retiradaLucroTotal ?? 0);
        if(direto > 0) return direto;

        if(Array.isArray(t.outflows)){
          return t.outflows
            .filter(o => String(o.category || o.type || "").toLowerCase() === "lucro")
            .reduce((s,o) => s + moneyToNumber(o.value || 0), 0);
        }

        return 0;
      };

      const done = monthItems.reduce((s,item) => s + lucroDoItem(item), 0);
      const percent = target > 0
        ? Math.max(0, Math.min(100, (done / target) * 100))
        : 0;

      const remaining = Math.max(0, target - done);

      monthlyGoalProgressState = { target, done, percent, remaining };
      return monthlyGoalProgressState;
    }

      if(input.value === today && historyCache.length && !hasHistoryForDateKey(today)){

    /* =========================================================
       HISTÃRICO â CARREGAMENTO DO DIA ATUAL CORRIGIDO
       Evita tela vazia inicial: quando o Firebase carrega, re-renderiza.
       Filtra o dia por mÃºltiplos campos de data do fechamento/ajuste.
    ========================================================= */
    function bkHistoryDateKeys(item){
      const t = item?.turno || {};
      const values = [
        item?.sortAt,
        t.sortAt,
        item?.selectedSortAt,
        t.selectedSortAt,
        item?.adjustmentSortAt,
        t.adjustmentSortAt,
        item?.submittedAt,
        t.submittedAt,
        t.adjustmentChosenDate,
        t.adjustmentDate,
        item?.adjustmentChosenDate,
        item?.adjustmentDate,
        t.closingDate,
        t.dataFechamento,
        item?.createdAt
      ];

      const keys = [];

      values.forEach(v=>{
        const d = bkDateFromAny(v);
        if(d && !isNaN(d)){
          const k = dateKeySP(d);
          if(k && !keys.includes(k)) keys.push(k);
        }
      });

      return keys;
    }

    function bkHistoryMatchesDate(item, dateKey){
      if(!dateKey) return true;
      return bkHistoryDateKeys(item).includes(dateKey);
    }

    function bkHistoryBaseList(){
      let list = historyCache
        .filter(withinHistoryRetention)
        .filter(canAccessHistoryItem);

      if(!list.length && historyCache.length){
        list = historyCache.filter(canAccessHistoryItem);
      }

      return bkSortHistoryDesc(list);
    }

    function bkLatestAvailableDateKey(){
      const list = bkHistoryBaseList();
      for(const item of list){
        const keys = bkHistoryDateKeys(item);
        if(keys.length) return keys[0];
      }
      return todayKeySP();
    }

    function bkHasDateLoaded(dateKey){
      return bkHistoryBaseList().some(item => bkHistoryMatchesDate(item, dateKey));
    }

    function ensureHistoryOpenDayLoaded(){
      const input = $("historyDate");
      if(!input) return todayKeySP();

      const today = todayKeySP();

      if(!input.value){
        input.value = today;
      }

      // Se hoje ainda aparece vazio no primeiro render, mas jÃ¡ existem dados,
      // abre o dia mais recente disponÃ­vel para evitar tela branca.
      if(input.value === today && historyCache.length && !bkHasDateLoaded(today)){
        input.value = bkLatestAvailableDateKey();
      }

      historyDaysVisible = 1;
      return input.value || today;
    }

      clearTimeout(window.__bkHistoryRenderTimer);
      window.__bkHistoryRenderTimer = setTimeout(()=>{
        if(isScreenActive("History")){

    /* =========================================================
       HISTÃRICO â VISÃVEL SEM CLICAR
       Primeiro carregamento sempre mostra registros disponÃ­veis.
       CalendÃ¡rio sÃ³ filtra apÃ³s escolha manual.
    ========================================================= */
    let historyDateWasManuallySelected = false;

    function getHistoryDefaultDateKeyFromLoadedData(){
      const today = todayKeySP();

      if(bkHasDateLoaded && bkHasDateLoaded(today)) return today;

      const latest = bkLatestAvailableDateKey ? bkLatestAvailableDateKey() : "";
      return latest || today;
    }

    function renderRanking(){
      const start = periodStart(currentRankRange);
      let list = operationalHistory();

      if(start){
        list = list.filter(x=>{
          const d = x.submittedAt?.toDate ? x.submittedAt.toDate() : new Date(x.turno?.closingDate || x.createdAt || 0);
          return d >= start;
        });
      }

      const map = new Map();
      list.forEach(x=>{
        const name = getOperadorName(x);
        const diff = moneyToNumber(x.diff ?? 0);
        const prev = map.get(name) || { name, total:0, count:0 };
        prev.total += diff;
        prev.count += 1;
        map.set(name, prev);
      });

      const ranking = [...map.values()].sort((a,b)=>b.total-a.total);
      const RANKING_DOM_LIMIT = 80;
      const rankingView = ranking.slice(0, RANKING_DOM_LIMIT);
      const maxAbs = Math.max(...ranking.map(r=>Math.abs(r.total)), 1);

      $("rankingList").innerHTML = rankingView.map((r,i)=>{
        const percent = Math.min(100, (Math.abs(r.total) / maxAbs) * 100);

        const status = positive ? "Caixa positivo" : "Caixa negativo";
        const position = i + 1;

        return `<div class="rank-item">

    function exportReceiptAsPng(){
      const panel = document.querySelector(".receipt-panel");
      if(!panel){
        alert("Resumo nÃ£o encontrado.");
        return;
      }

      const btn = $("receiptExportPngBtn");
      const originalBtnText = btn ? btn.textContent : "";

      function resetButton(){
        if(btn){
          btn.disabled = false;
          btn.textContent = originalBtnText || "Exportar resumo PNG";
        }
      }

      function restorePanel(originalMaxHeight, originalOverflow, hiddenEls){
        panel.style.maxHeight = originalMaxHeight;
        panel.style.overflow = originalOverflow;
        hiddenEls.forEach(function(el){
          el.style.display = el.getAttribute("data-old-display") || "";
          el.removeAttribute("data-old-display");
        });
      }

      if(btn){
        btn.disabled = true;
        btn.textContent = "Gerando PNG...";
      }

      function startExport(){
        const originalMaxHeight = panel.style.maxHeight;
        const originalOverflow = panel.style.overflow;
        const hiddenEls = Array.from(panel.querySelectorAll("button, .receipt-actions, #receiptAdminActions"));

        hiddenEls.forEach(function(el){
          el.setAttribute("data-old-display", el.style.display || "");
          el.style.display = "none";
        });

        panel.style.maxHeight = "none";
        panel.style.overflow = "visible";

        setTimeout(function(){
          window.html2canvas(panel, {
            backgroundColor: "#ffffff",
            scale: Math.min(3, window.devicePixelRatio || 2),
            useCORS: true,
            logging: false
          }).then(function(canvas){
            restorePanel(originalMaxHeight, originalOverflow, hiddenEls);

            const fileName = "bank-king-resumo-" + Date.now() + ".png";

            if(canvas.toBlob){
              canvas.toBlob(function(blob){
                if(blob){
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement("a");
                  a.href = url;
                  a.download = fileName;
                  document.body.appendChild(a);
                  a.click();
                  a.remove();
                  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
                }else{
                  const a = document.createElement("a");
                  a.href = canvas.toDataURL("image/png");
                  a.download = fileName;
                  a.click();
                }
                resetButton();
              }, "image/png", 1);
            }else{
              const a = document.createElement("a");
              a.href = canvas.toDataURL("image/png");
              a.download = fileName;
              a.click();
              resetButton();
            }
          }).catch(function(error){
            console.error("Erro PNG:", error);
            restorePanel(originalMaxHeight, originalOverflow, hiddenEls);
            resetButton();
            alert("NÃ£o consegui gerar o PNG neste navegador.");
          });
        }, 150);
      }

      if(window.html2canvas){
        startExport();
        return;
      }

      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
      script.onload = startExport;
      script.onerror = function(){
        resetButton();
        alert("NÃ£o foi possÃ­vel carregar o exportador PNG. Verifique a internet e tente novamente.");
      };
      document.head.appendChild(script);
    }

    async function recalculateAllHistory(){
      if(!await requireAdmin()) return false;

      showReloadLoaderSafe("Atualizando sistema", "Recalculando dados...");

      try{
        const qh=query(collection(db,"history"),orderBy("submittedAt","asc"));
        const snap=await withTimeout(getDocs(qh), 8000, "buscar histÃ³rico");
        let operationalBaseSaldo=null;

        for(const item of snap.docs){
          try{
            const data=item.data();
            const turno=data.turno||{};
            const isAdjustment = data.adjustment === true || data.type === "capital_injection" || turno.ajusteTipo === "carga_rapida";
            const adjustmentParts = isAdjustment ? getAdjustmentParts({ ...data, turno }) : null;
            const saldoLiquido = isAdjustment ? adjustmentImpact({ ...data, turno }) : calcularSaldoLiquido(turno);
            let currentSaldoTotal, diff;

            if(isAdjustment){
              diff = saldoLiquido;
              currentSaldoTotal = saldoLiquido;
              operationalBaseSaldo = (operationalBaseSaldo ?? 0) + diff;
            }else{
              currentSaldoTotal = saldoLiquido;
              diff = operationalBaseSaldo===null ? 0 : currentSaldoTotal - operationalBaseSaldo;
              operationalBaseSaldo = calcularBaseOperacional({ ...turno, saldoLiquido });
            }

            const baseOperacional = isAdjustment ? operationalBaseSaldo : calcularBaseOperacional({ ...turno, saldoLiquido });

            const updatePayload = {
              "turno.saldoLiquido": saldoLiquido,
              "turno.baseOperacional": baseOperacional,
              currentSaldoTotal,
              operationalBase: baseOperacional,
              diff,
              recalculatedAt: serverTimestamp()
            };

            if(isAdjustment && adjustmentParts){
              updatePayload["turno.retiradaCaixa"] = adjustmentParts.retiradaCaixa;
              updatePayload["turno.saidasTotal"] = adjustmentParts.retiradaCaixa;
              updatePayload["turno.ajusteImpacto"] = saldoLiquido;
            }

            await withTimeout(updateDoc(doc(db,"history",item.id), updatePayload), 5000, "atualizar histÃ³rico");
          }catch(e){
            console.warn("HistÃ³rico ignorado no recÃ¡lculo:", item.id, e);
          }
        }

        try{
          await withTimeout(addAudit("recalculate_history","HistÃ³rico recalculado com seguranÃ§a"), 4000, "salvar auditoria");
        }catch(auditErr){
          console.warn("Auditoria ignorada:", auditErr);
        }

        renderAll("data");
        return true;
      }catch(e){
        console.error("Erro no recÃ¡lculo:", e);
        alert(friendlyError(e));
        return false;
      }finally{
        hideReloadLoaderSafe(250);
      }
    }

    async function fetchAnnualHistoryIfNeeded(){
      try{
        const start = $("reportStart")?.value || "";
        const end = $("reportEnd")?.value || "";

        if(!start || !end) return false;

        const startDate = new Date(start + "T00:00:00");
        const endDate = new Date(end + "T23:59:59");

        if(isNaN(startDate) || isNaN(endDate)) return false;

        const diffDays = Math.ceil((endDate - startDate) / 86400000);

        // Se o relatÃ³rio passar de 91 dias, puxa mais documentos sob demanda.
        if(diffDays <= HISTORY_RETENTION_DAYS) return false;

        const qh = query(collection(db,"history"), orderBy("submittedAt","desc"), limit(HISTORY_ANNUAL_LOAD_LIMIT));
        const snap = await getDocs(qh);

        const byId = new Map(historyCache.map(item => [item.id, item]));
        snap.docs.forEach(d => byId.set(d.id, { id:d.id, ...d.data() }));

        historyCache = [...byId.values()].sort((a,b)=>{
          const da = historyItemDate(a);
          const dbb = historyItemDate(b);
          return dbb - da;
        });

        return true;
      }catch(e){
        console.warn("NÃ£o foi possÃ­vel carregar histÃ³rico anual ampliado:", e);
        return false;
      }
    }

    function compressProfileImage(file){
      return new Promise((resolve,reject)=>{
        if(!file) return resolve("");
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("NÃ£o foi possÃ­vel ler a imagem."));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("Arquivo de imagem invÃ¡lido."));
          img.onload = () => {
            const size = 360;
            const canvas = document.createElement("canvas");
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");
            const side = Math.min(img.width, img.height);
            const sx = (img.width - side) / 2;
            const sy = (img.height - side) / 2;
            ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
            resolve(canvas.toDataURL("image/jpeg", .72));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function initBankMicroUX(){
      const rippleTargets = ".btn,.small-btn,.admin-toggle,.nav-btn,.more-menu-btn,.icon-btn";
      document.querySelectorAll(rippleTargets).forEach(btn=>{
        if(btn.dataset.rippleBound) return;
        btn.dataset.rippleBound = "1";
        btn.addEventListener("click",(ev)=>{
          const rect = btn.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);
          const ripple = document.createElement("span");
          ripple.className = "ripple";
          ripple.style.width = ripple.style.height = size + "px";
          ripple.style.left = (ev.clientX - rect.left - size / 2) + "px";
          ripple.style.top = (ev.clientY - rect.top - size / 2) + "px";
          btn.appendChild(ripple);
          setTimeout(()=>ripple.remove(), 620);
        });
      });

      document.querySelectorAll(".screen.active .card,.screen.active .history-item,.screen.active .rank-item").forEach((card,index)=>{
        card.classList.add("stagger-in");
        card.style.setProperty("--stagger", index % 8);
      });
    }
